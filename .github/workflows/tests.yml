name: tests

on:
  pull_request:
  push:
    branches:
    - main

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run all the tests, including the OBP-API contract and the v5.1.0 version floor
        run: go test -count=1 ./...
